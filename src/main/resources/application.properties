spring.application.name=DocumentManagementSystem

!생성한 DB의 URL, 계정, 비밀번호를 설정합니다.

spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/FREEPDB1
spring.datasource.username=document_user

!데이터베이스 비밀번호를 환경 변수에서 가져온다는 뜻
!비밀번호를 프로젝트 파일에 직접 저장하지 않도록 하는 설정

spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

!웹 요청의 처리 과정에서 DB 세션을 열어두지 않도록 설정
!데이터조회와 트렌젝션을 서비스계층에서 처리하도록 설정
spring.jpa.open-in-view=false